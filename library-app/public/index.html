<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#1D9E75" />
  <title>Library Manager</title>
  <link rel="icon" type="image/png" href="%PUBLIC_URL%/logo.png" />
  <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo.png" />
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f8f9fa; }
    :root {
      --color-text-primary: #111827;
      --color-text-secondary: #6b7280;
      --color-text-success: #065f46;
      --color-text-danger: #991b1b;
      --color-text-info: #1e40af;
      --color-background-primary: #ffffff;
      --color-background-secondary: #f3f4f6;
      --color-background-success: #d1fae5;
      --color-background-danger: #fee2e2;
      --color-background-info: #dbeafe;
      --color-border-secondary: #e5e7eb;
      --color-border-tertiary: #f3f4f6;
      --color-border-danger: #fca5a5;
      --border-radius-md: 8px;
      --border-radius-lg: 12px;
    }
    input, button, select { font-family: inherit; font-size: 14px; }
    input[type=text], input[type=tel], input[type=number], input[type=date] {
      border: 1px solid #d1d5db; border-radius: 8px; padding: 8px 12px;
      outline: none; background: #fff; color: #111827;
    }
    input:focus { border-color: #1D9E75; box-shadow: 0 0 0 2px #1D9E7520; }
    button { border-radius: 8px; cursor: pointer; }
  </style>
</head>
<body>
  <div id="root"></div>
</body>
</html>
